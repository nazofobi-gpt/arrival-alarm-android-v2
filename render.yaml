# Render Blueprint for the Arrival Alarm connector.
# Committing this file does not create resources. Deploying it provisions a paid web
# service because persistent disks are not available on Render's free web plan.
previews:
  generation: off

services:
  - type: web
    name: arrival-alarm-connector
    runtime: node
    branch: main
    rootDir: connector-server
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm install --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /
    maxShutdownDelaySeconds: 30

    disk:
      name: connector-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: GATEWAY_SQLITE_PATH
        value: /var/data/arrival-alarm.db

      # Resolve the service's assigned HTTPS origin after Blueprint creation.
      - key: MCP_PUBLIC_BASE_URL
        fromService:
          type: web
          name: arrival-alarm-connector
          envVarKey: RENDER_EXTERNAL_URL

      # ChatGPT-side OAuth 2.1 / OIDC resource configuration.
      # Provide these during the first Blueprint sync; values remain outside git.
      - key: OAUTH_AUTHORIZATION_SERVER
        sync: false
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_AUDIENCE
        sync: false
      - key: OAUTH_JWKS_URL
        sync: false

      # Native Android public-client OAuth configuration.
      - key: DEVICE_OAUTH_AUTHORIZATION_ENDPOINT
        sync: false
      - key: DEVICE_OAUTH_TOKEN_ENDPOINT
        sync: false
      - key: DEVICE_OAUTH_REVOCATION_ENDPOINT
        sync: false
      - key: DEVICE_OAUTH_CLIENT_ID
        sync: false
      - key: DEVICE_OAUTH_SCOPES
        value: arrival.device offline_access
      - key: DEVICE_OAUTH_DEVICE_ID_PARAMETER
        value: device_id
