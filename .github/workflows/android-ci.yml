name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_germany_full:
        description: "Run real Germany Full GTFS preflight (large download)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Android locale resources
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/check_locale_resources.py

      - name: Enforce G-191 Android location and manifest privacy policy
        run: |
          python3 -m unittest discover -s tools -p 'test_android_privacy_manifest.py' -v
          python3 tools/check_android_privacy_manifest.py app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Produce a distributable debug APK before running potentially long test gates.
      - name: Build debug APK first
        run: ./gradlew --no-daemon assembleDebug

      - name: Record exact APK source and checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
          printf 'source_commit=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > app/build/outputs/apk/debug/BUILD_PROVENANCE.txt

      - name: Upload debug APK before test batch
        uses: actions/upload-artifact@v4
        with:
          name: arrival-alarm-v2-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run lint and JVM unit tests as one batch
        run: ./gradlew --no-daemon lint testDebugUnitTest

      - name: G-174 real Germany Full feed acceptance
        if: >-
          github.head_ref == 'exec2/g174-full-gtfs-schema' ||
          github.ref_name == 'exec2/g174-full-gtfs-schema' ||
          github.head_ref == 'verify/g185-real-feed-20261031-chat' ||
          (github.event_name == 'workflow_dispatch' && inputs.verify_germany_full)
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 https://download.gtfs.de/germany/free/latest.zip -o /tmp/germany-full.zip
          python3 tools/verify_germany_full_gtfs.py /tmp/germany-full.zip /tmp/g174-real-feed-report.json
          python3 tools/gtfs_feed_provenance.py /tmp/germany-full.zip /tmp/g174-real-feed-report.json /tmp/g174-real-feed-provenance.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            /tmp/g174-real-feed-report.json
            /tmp/g174-real-feed-provenance.json
          if-no-files-found: ignore
          retention-days: 14

