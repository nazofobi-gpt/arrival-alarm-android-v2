name: Duplicate Work-Unit Guard

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: duplicate-work-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Reject duplicate work units
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact code for this PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run duplicate work-unit regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_duplicate_pr_guard.py' -v

      - name: Reconcile live PR inventory before admitting new work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_pr_duplication.py
