name: Android API 36 Emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-api36-global
  cancel-in-progress: false

jobs:
  api36:
    name: API 36 instrumentation + field RC
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run API 36 instrumentation and verify non-debug field RC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail

            adb shell wm size 412x915
            adb shell settings put system font_scale 1.0
            adb shell wm size
            adb shell settings get system font_scale
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p app/build/outputs/androidTest-results/compact-screen
            adb exec-out screencap -p > app/build/outputs/androidTest-results/compact-screen/compact-412x915-normal-text.png

            adb shell settings put system font_scale 2.0
            adb shell am force-stop com.nazofobi.arrivalalarm || true
            adb shell settings get system font_scale
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.MainActivityTest#largeFontKeepsCriticalJourneyControlsReachable
            mkdir -p app/build/outputs/androidTest-results/large-font
            adb exec-out screencap -p > app/build/outputs/androidTest-results/large-font/compact-412x915-font-200.png

            adb shell settings put system font_scale 1.0
            adb shell wm size reset

            ./gradlew --no-daemon assembleRelease

            BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            RC_DIR="app/build/outputs/field-rc"
            ALIGNED_APK="$RC_DIR/app-release-aligned.apk"
            RC_APK="$RC_DIR/arrival-alarm-v2-field-rc.apk"
            KEYSTORE="$RUNNER_TEMP/arrival-alarm-field-rc.jks"

            test -f "$UNSIGNED_APK"
            mkdir -p "$RC_DIR"

            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass changeit \
              -keypass changeit \
              -alias fieldrc \
              -keyalg RSA \
              -keysize 2048 \
              -validity 2 \
              -dname "CN=Arrival Alarm Field RC,O=Ephemeral CI Test,C=DE"

            "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:changeit \
              --key-pass pass:changeit \
              --out "$RC_APK" \
              "$ALIGNED_APK"

            "$BUILD_TOOLS/zipalign" -c -v 4 "$RC_APK"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RC_APK" | tee "$RC_DIR/apksigner-verify.txt"
            "$BUILD_TOOLS/aapt" dump badging "$RC_APK" | tee "$RC_DIR/manifest-badging.txt"
            if grep -q '^application-debuggable' "$RC_DIR/manifest-badging.txt"; then
              echo "Field RC must not be debuggable" >&2
              exit 1
            fi

            printf 'source_commit=%s\nvariant=release\nsigning=ephemeral_ci_field_test_not_production\n' "$GITHUB_SHA" > "$RC_DIR/BUILD_PROVENANCE.txt"
            sha256sum "$RC_APK" | tee "$RC_DIR/SHA256SUMS.txt"

            adb uninstall com.nazofobi.arrivalalarm >/dev/null 2>&1 || true
            adb install "$RC_APK"
            adb shell am start -W -n com.nazofobi.arrivalalarm/.MainActivity | tee "$RC_DIR/api36-launch.txt"
            adb shell pidof com.nazofobi.arrivalalarm | tee "$RC_DIR/api36-pid.txt"
            test -s "$RC_DIR/api36-pid.txt"
            adb exec-out screencap -p > "$RC_DIR/api36-field-rc-launch.png"

      - name: Upload API 36 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api36-diagnostics-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/field-rc/apksigner-verify.txt
            app/build/outputs/field-rc/manifest-badging.txt
            app/build/outputs/field-rc/api36-launch.txt
            app/build/outputs/field-rc/api36-pid.txt
            app/build/outputs/field-rc/api36-field-rc-launch.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload non-debug field RC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-alarm-v2-field-rc-${{ github.sha }}
          path: |
            app/build/outputs/field-rc/arrival-alarm-v2-field-rc.apk
            app/build/outputs/field-rc/SHA256SUMS.txt
            app/build/outputs/field-rc/BUILD_PROVENANCE.txt
            app/build/outputs/field-rc/apksigner-verify.txt
            app/build/outputs/field-rc/manifest-badging.txt
          if-no-files-found: error
          retention-days: 14
