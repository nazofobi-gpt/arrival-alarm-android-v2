name: Android API 36 Emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api36:
    name: API 36 instrumentation + field RC
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Download Germany Full acceptance feed
        if: github.head_ref == 'exec1/g175-real-feed-verify-20261004' || github.ref_name == 'exec1/g175-real-feed-verify-20261004'
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 1200 https://download.gtfs.de/germany/free/latest.zip -o /tmp/germany-full.zip
          sha256sum /tmp/germany-full.zip | tee /tmp/germany-full.sha256
          python3 tools/reduce_germany_full_for_g175.py /tmp/germany-full.zip /tmp/g175-real-feed.zip /tmp/g175-reduction-report.json
          sha256sum /tmp/g175-real-feed.zip | tee /tmp/g175-real-feed.sha256

      - name: Fetch current Germany GTFS-RT for G-176 acceptance
        if: github.head_ref == 'interactive/g176-live-smoke-20261004' || github.ref_name == 'interactive/g176-live-smoke-20261004' || github.head_ref == 'g176-real-sample-acceptance-20261005' || github.ref_name == 'g176-real-sample-acceptance-20261005'
        run: |
          set -eu
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            https://realtime.gtfs.de/realtime-free.pb \
            -o /tmp/g176-live.pb
          bytes="$(stat -c%s /tmp/g176-live.pb)"
          test "$bytes" -gt 0
          test "$bytes" -le 67108864
          sha256sum /tmp/g176-live.pb | tee /tmp/g176-live.sha256
          printf '%s\n' "$bytes" | tee /tmp/g176-live.bytes

      - name: Resolve visual QA GTFS cache key
        id: visual-gtfs-day
        run: echo "day=$(TZ=Europe/Berlin date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Germany Full visual QA source
        id: visual-gtfs-cache
        uses: actions/cache@v4
        with:
          path: /tmp/germany-full-visual.zip
          key: germany-full-visual-${{ steps.visual-gtfs-day.outputs.day }}

      - name: Prepare Germany Full-derived visual QA feed
        run: |
          if [ ! -s /tmp/germany-full-visual.zip ]; then
            curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 1200 https://download.gtfs.de/germany/free/latest.zip -o /tmp/germany-full-visual.zip
          fi
          sha256sum /tmp/germany-full-visual.zip | tee /tmp/g167-visual-source.sha256
          python3 tools/reduce_germany_full_for_g175.py /tmp/germany-full-visual.zip /tmp/g167-visual-qa.zip /tmp/g167-visual-reduction-report.json
          sha256sum /tmp/g167-visual-qa.zip | tee /tmp/g167-visual-fixture.sha256
          test -s /tmp/g167-visual-qa.zip
          test -s /tmp/g167-visual-reduction-report.json

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run API 36 instrumentation and verify non-debug field RC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            test ! -s /tmp/g175-real-feed.zip || (adb shell rm -f /sdcard/Download/g175-real-feed-report.json && adb push /tmp/g175-real-feed.zip /data/local/tmp/g175-real-feed.zip && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.G175RealFeedInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.germanyFullPath=/data/local/tmp/g175-real-feed.zip && mkdir -p app/build/outputs/androidTest-results/g175-real-feed && adb pull /sdcard/Download/g175-real-feed-report.json app/build/outputs/androidTest-results/g175-real-feed/ && cp /tmp/germany-full.sha256 /tmp/g175-real-feed.sha256 /tmp/g175-reduction-report.json app/build/outputs/androidTest-results/g175-real-feed/ && test -s app/build/outputs/androidTest-results/g175-real-feed/g175-real-feed-report.json)

            test ! -s /tmp/g176-live.pb || (adb shell rm -f /sdcard/Download/g176-live-realtime-report.json && adb push /tmp/g176-live.pb /data/local/tmp/g176-live.pb && ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.G176LiveRealtimeInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.realtimePath=/data/local/tmp/g176-live.pb && mkdir -p app/build/outputs/androidTest-results/g176-live && adb pull /sdcard/Download/g176-live-realtime-report.json app/build/outputs/androidTest-results/g176-live/ && cp /tmp/g176-live.sha256 /tmp/g176-live.bytes app/build/outputs/androidTest-results/g176-live/ && test -s app/build/outputs/androidTest-results/g176-live/g176-live-realtime-report.json)

            adb shell wm size 412x915
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            adb shell rm -rf /sdcard/Download/arrival-alarm-ui-qa
            adb shell wm size
            adb shell wm density
            adb shell settings get system font_scale
            adb push /tmp/g167-visual-qa.zip /data/local/tmp/g167-visual-qa.zip
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.MainActivityTest#capturePrimaryScreensForVisualQa -Pandroid.testInstrumentationRunnerArguments.germanyFullPath=/data/local/tmp/g167-visual-qa.zip
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.G170NearbyVisualInstrumentedTest#realGermanyFeedLohneNearbyHasOneCanonicalStationAndRetainsScreenshot -Pandroid.testInstrumentationRunnerArguments.germanyFullPath=/data/local/tmp/g167-visual-qa.zip
            adb shell pm clear com.nazofobi.arrivalalarm || true
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p app/build/outputs/androidTest-results/ui-qa
            adb shell ls -l /sdcard/Download/arrival-alarm-ui-qa
            adb pull /sdcard/Download/arrival-alarm-ui-qa/. app/build/outputs/androidTest-results/ui-qa/
            cp /tmp/g167-visual-source.sha256 /tmp/g167-visual-fixture.sha256 /tmp/g167-visual-reduction-report.json app/build/outputs/androidTest-results/ui-qa/
            test -s app/build/outputs/androidTest-results/ui-qa/onboarding.png
            test -s app/build/outputs/androidTest-results/ui-qa/home.png
            test -s app/build/outputs/androidTest-results/ui-qa/search.png
            test -s app/build/outputs/androidTest-results/ui-qa/route.png
            test -s app/build/outputs/androidTest-results/ui-qa/journey.png
            test -s app/build/outputs/androidTest-results/ui-qa/live.png
            test -s app/build/outputs/androidTest-results/ui-qa/departures.png
            test -s app/build/outputs/androidTest-results/ui-qa/settings.png
            test -s app/build/outputs/androidTest-results/ui-qa/g170-lohne-nearby.png
            printf '%s\n' onboarding.png home.png search.png route.png journey.png live.png departures.png settings.png > app/build/outputs/androidTest-results/ui-qa/SCREENSHOT_MANIFEST.txt
            sha256sum app/build/outputs/androidTest-results/ui-qa/onboarding.png app/build/outputs/androidTest-results/ui-qa/home.png app/build/outputs/androidTest-results/ui-qa/search.png app/build/outputs/androidTest-results/ui-qa/route.png app/build/outputs/androidTest-results/ui-qa/journey.png app/build/outputs/androidTest-results/ui-qa/live.png app/build/outputs/androidTest-results/ui-qa/departures.png app/build/outputs/androidTest-results/ui-qa/settings.png > app/build/outputs/androidTest-results/ui-qa/SCREENSHOT_SHA256SUMS.txt
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.nazofobi.arrivalalarm || true
            adb shell am start -W -n com.nazofobi.arrivalalarm/.MainActivity
            sleep 1
            mkdir -p app/build/outputs/androidTest-results/compact-screen
            adb exec-out screencap -p > app/build/outputs/androidTest-results/compact-screen/compact-412x915-normal-text.png

            adb shell wm size 1600x1000
            adb shell wm density 160
            adb shell am force-stop com.nazofobi.arrivalalarm || true
            adb shell wm size
            adb shell wm density
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.MainActivityTest#wideWindowKeepsPrimaryContentAtReadableWidth -Pandroid.testInstrumentationRunnerArguments.requireWide=true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.nazofobi.arrivalalarm || true
            adb shell am start -W -n com.nazofobi.arrivalalarm/.MainActivity
            sleep 1
            mkdir -p app/build/outputs/androidTest-results/wide-window
            adb exec-out screencap -p > app/build/outputs/androidTest-results/wide-window/wide-1600x1000-readable-content.png

            adb shell wm size 412x915
            adb shell wm density 160
            adb shell settings put system font_scale 2.0
            adb shell am force-stop com.nazofobi.arrivalalarm || true
            adb shell settings get system font_scale
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nazofobi.arrivalalarm.MainActivityTest#largeFontKeepsCriticalJourneyControlsReachable
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.nazofobi.arrivalalarm || true
            adb shell am start -W -n com.nazofobi.arrivalalarm/.MainActivity
            sleep 1
            mkdir -p app/build/outputs/androidTest-results/large-font
            adb exec-out screencap -p > app/build/outputs/androidTest-results/large-font/compact-412x915-font-200.png

            adb shell settings put system font_scale 1.0
            adb shell wm density reset
            adb shell wm size reset

            bash .github/scripts/build-field-rc.sh

      - name: Upload API 36 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api36-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/field-rc/apksigner-verify.txt
            app/build/outputs/field-rc/manifest-badging.txt
            app/build/outputs/field-rc/api36-launch.txt
            app/build/outputs/field-rc/api36-pid.txt
            app/build/outputs/field-rc/api36-field-rc-launch.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload non-debug field RC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-alarm-v2-field-rc-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/field-rc/arrival-alarm-v2-field-rc.apk
            app/build/outputs/field-rc/SHA256SUMS.txt
            app/build/outputs/field-rc/BUILD_PROVENANCE.txt
            app/build/outputs/field-rc/apksigner-verify.txt
            app/build/outputs/field-rc/manifest-badging.txt
          if-no-files-found: error
          retention-days: 14